{% load static %}<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}SHOP — інтернет-магазин{% endblock %}</title>
<meta name="description" content="{% block description %}Подушки, ковдри та білизна від виробника. Доставка по всій Україні.{% endblock %}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body>
{% include "partials/header.html" %}

{% if messages %}
<div class="msgs" role="status">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }} · <a href="{% url 'cart' %}">У кошик →</a></div>{% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

{% include "partials/footer.html" %}
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
