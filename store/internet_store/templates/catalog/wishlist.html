{% extends "base.html" %}
{% block title %}Бажане — SHOP{% endblock %}
{% block content %}
<main class="wrap">
  <h1 class="ptitle">Бажане <small>{{ products|length }} товарів</small></h1>
  <div class="grid">
    {% for p in products %}{% include "partials/product_card.html" %}
    {% empty %}<p class="empty">У бажаному поки порожньо. <a class="link" href="{% url 'catalog' %}">Перейти до каталогу</a></p>{% endfor %}
  </div>
</main>
{% endblock %}
